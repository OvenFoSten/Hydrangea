<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 156" role="img" aria-labelledby="title description">
  <title id="title">Two overlapping EffectRanges</title>
  <desc id="description">A tall blue prefix spans two rows. To its right, Area A's long green range and Area B's shorter, lighter green range begin at the same position. B's range lies within A's range. The colors distinguish the ranges, not lifecycle states.</desc>

  <rect width="960" height="156" rx="12" fill="#0f172a"/>

  <path d="M 44 32 H 332 V 124 H 44 Q 32 124 32 112 V 44 Q 32 32 44 32 Z" fill="#7ba9d3"/>
  <path d="M 332 32 H 916 Q 928 32 928 44 V 66 Q 928 78 916 78 H 332 Z" fill="#57a773"/>
  <path d="M 332 78 H 632 V 112 Q 632 124 620 124 H 332 Z" fill="#8fd694"/>

  <g fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" text-anchor="middle">
    <text x="182" y="85">Prefix</text>
    <text x="630" y="62">Area A</text>
    <text x="482" y="108">Area B</text>
  </g>
</svg>
