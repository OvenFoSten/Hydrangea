<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title description">
  <title id="title">ObserveRange boundaries</title>
  <desc id="description">A continuous Context bar shows a blue prefix followed by a green ObserveRange. The range starts at the insertion position of the Area's first tick, even if it emitted nothing, and ends at the current Context tail when observe is called.</desc>

  <rect width="960" height="180" rx="12" fill="#0f172a"/>
  <defs>
    <clipPath id="observe-bar">
      <rect x="32" y="62" width="896" height="56" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#observe-bar)">
    <rect x="32" y="62" width="224" height="56" fill="#7ba9d3"/>
    <rect x="256" y="62" width="672" height="56" fill="#8fd694"/>
  </g>

  <g fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" text-anchor="middle">
    <text x="144" y="97">Prefix</text>
    <text x="592" y="97">ObserveRange</text>
  </g>

  <path d="M 256 42 V 58 M 928 42 V 58" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#f8fafc" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="18">
    <text x="256" y="34" text-anchor="middle">start</text>
    <text x="928" y="34" text-anchor="end">latest</text>
  </g>
  <g fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">
    <text x="256" y="148" text-anchor="middle">First tick's insertion point</text>
    <text x="928" y="148" text-anchor="end">Current Context tail</text>
  </g>
</svg>
