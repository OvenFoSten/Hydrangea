<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title description">
  <title id="title">EffectRange の境界</title>
  <desc id="description">連続した Context のバーに、青い prefix、緑の EffectRange、その後に続く青い Context を示す。範囲は Area が最初に出力したメッセージから、最後に出力したメッセージまで。その後の Context は、記録された EffectRange の外にある。</desc>

  <rect width="960" height="180" rx="12" fill="#0f172a"/>
  <defs>
    <clipPath id="effect-bar">
      <rect x="32" y="62" width="896" height="56" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#effect-bar)">
    <rect x="32" y="62" width="224" height="56" fill="#7ba9d3"/>
    <rect x="256" y="62" width="408" height="56" fill="#57a773"/>
    <rect x="664" y="62" width="264" height="56" fill="#7ba9d3"/>
  </g>

  <g fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" text-anchor="middle">
    <text x="144" y="97">Prefix（既存部分）</text>
    <text x="460" y="97">EffectRange</text>
    <text x="796" y="97">後続の Context</text>
  </g>

  <path d="M 256 42 V 58 M 664 42 V 58" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#f8fafc" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="18" text-anchor="middle">
    <text x="256" y="34">start</text>
    <text x="664" y="34">latest</text>
  </g>
  <g fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="16" text-anchor="middle">
    <text x="256" y="148">最初に出力したメッセージ</text>
    <text x="664" y="148">最後に出力したメッセージ</text>
  </g>
</svg>
