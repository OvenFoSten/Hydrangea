[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrangea-gateway"
version = "0.1.0"
description = "A small, lightweight LLM gateway."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai~=2.10.0",
    "openai>=2.44.0,<3.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "typing-extensions>=4.15.0,<5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydrangea", "hydrangea.*"]

[tool.setuptools.package-data]
hydrangea = ["py.typed"]
